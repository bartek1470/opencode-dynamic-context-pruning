name: PR Checks

on:
    pull_request:
        branches: [master, dev]

jobs:
    validate:
        name: Type Check, Build & Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Type check
              run: npm run typecheck

            - name: Install isolated V2 contract dependencies
              run: npm ci --prefix tests/v2-contracts --omit=optional

            - name: Check published V2 contracts
              run: npm run typecheck:v2

            - name: Test both host adapters
              run: npm test

            - name: Build
              run: npm run check:package

            - name: Security audit
              run: npm audit --audit-level=high
              continue-on-error: false
